[project]
name = "data-platform-blueprint"
version = "0.1.0"
description = "Local-first data platform reference with synthetic data"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
